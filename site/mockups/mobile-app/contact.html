<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>It's Jesse! - Contact</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0A0A0F;
      color: white;
      width: 393px;
      height: 852px;
      overflow: hidden;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
    }
    .status-icons {
      display: flex;
      gap: 4px;
    }
    .status-icons span {
      width: 18px;
      height: 12px;
      background: white;
      border-radius: 2px;
    }
    .app-bar {
      padding: 16px 20px;
      font-size: 24px;
      font-weight: bold;
    }
    .content {
      overflow-y: auto;
      height: calc(100% - 150px);
      padding: 0 16px 20px;
    }
    .intro {
      text-align: center;
      margin-bottom: 24px;
    }
    .intro-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .intro-text {
      color: #9CA3AF;
      font-size: 14px;
    }
    .contact-methods {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }
    .contact-card {
      background: #1A1A2E;
      padding: 16px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .contact-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366F1, #8B5CF6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }
    .contact-info {
      flex: 1;
    }
    .contact-label {
      font-size: 12px;
      color: #6B7280;
      margin-bottom: 2px;
    }
    .contact-value {
      font-size: 14px;
      font-weight: 500;
    }
    .contact-arrow {
      color: #6B7280;
      font-size: 20px;
    }
    .social-section {
      margin-top: 24px;
    }
    .social-title {
      font-size: 16px;
      font-weight: bold;
      color: #6366F1;
      margin-bottom: 12px;
    }
    .social-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .social-card {
      background: #1A1A2E;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
    }
    .social-icon {
      font-size: 28px;
      margin-bottom: 8px;
    }
    .social-name {
      font-size: 14px;
      font-weight: 500;
    }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #0A0A0F;
      border-top: 1px solid #1A1A2E;
      display: flex;
      justify-content: space-around;
      padding: 8px 0 24px;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #6B7280;
    }
    .nav-item.active {
      color: #6366F1;
    }
    .nav-icon {
      font-size: 22px;
    }
  </style>
</head>
<body>
  <div class="status-bar">
    <span>9:41</span>
    <div class="status-icons">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>

  <div class="app-bar">Contact</div>

  <div class="content">
    <div class="intro">
      <div class="intro-title">Let's Work Together</div>
      <div class="intro-text">Have a project in mind? I'd love to hear about it.</div>
    </div>

    <div class="contact-methods">
      <div class="contact-card">
        <div class="contact-icon">&#9993;</div>
        <div class="contact-info">
          <div class="contact-label">Email</div>
          <div class="contact-value">jesse@itsjesse.dev</div>
        </div>
        <span class="contact-arrow">&#8250;</span>
      </div>

      <div class="contact-card">
        <div class="contact-icon">&#127760;</div>
        <div class="contact-info">
          <div class="contact-label">Website</div>
          <div class="contact-value">itsjesse.dev</div>
        </div>
        <span class="contact-arrow">&#8250;</span>
      </div>

      <div class="contact-card">
        <div class="contact-icon">&#128187;</div>
        <div class="contact-info">
          <div class="contact-label">GitHub</div>
          <div class="contact-value">github.com/itsjessedev</div>
        </div>
        <span class="contact-arrow">&#8250;</span>
      </div>
    </div>

    <div class="social-section">
      <div class="social-title">Connect</div>
      <div class="social-grid">
        <div class="social-card">
          <div class="social-icon">&#128101;</div>
          <div class="social-name">LinkedIn</div>
        </div>
        <div class="social-card">
          <div class="social-icon">&#128038;</div>
          <div class="social-name">Twitter</div>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item">
      <span class="nav-icon">&#127968;</span>
      <span>Home</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">&#128188;</span>
      <span>Projects</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">&#128196;</span>
      <span>Resume</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">&#128100;</span>
      <span>About</span>
    </div>
    <div class="nav-item active">
      <span class="nav-icon">&#9993;</span>
      <span>Contact</span>
    </div>
  </div>
</body>
</html>
